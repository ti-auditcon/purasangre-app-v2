<ion-content class="image-container">
    <swiper-container #slider [zoom]="true">
        <swiper-slide>
            <ion-card style="background: rgb(255,255,255);">
                <ion-card-header>
                    <ion-card-title>
                        <p class="the-user">{{ user }}</p>
                    </ion-card-title>
                </ion-card-header>
                
                <ion-card-content>
                      <img [src]="img"/>
                </ion-card-content>
            </ion-card>
        </swiper-slide>
    </swiper-container>
    <div class="layer-blur">
    </div>
</ion-content>
