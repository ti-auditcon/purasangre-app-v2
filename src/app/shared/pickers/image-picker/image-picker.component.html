<div (click)="onPickImage()">
    <div class="avatar-container">
        <img class="persona-avatar" [src]="AvatarImage" />
        <input
            type="file"
            accept="image/jpeg"
            *ngIf="userPicker"
            #filePicker
            (change)="onFileChosen($event)"
        />
    </div>

    <div>
        <h5 class="persona-cambiar-foto-perfil">Cambiar</h5>
    </div>
</div>
